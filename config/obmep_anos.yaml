# 17a OBMEP: 2022. Resultado divulgado em 20/12/2022 (Agencia Brasil, 2022-12).
# 18a OBMEP: 2023. Resultado divulgado em 20/12/2023; 1a edicao com premiacao estadual (O Povo, 2023-12-20).
