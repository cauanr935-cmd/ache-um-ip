# com confirmacao em fonte. Formato:  "<rotulo em premiados.htm>": <ano>
#
# Ano = ano das provas e da premiacao.
#
# 16a OBMEP: 2021. O Regulamento Especial da 16a OBMEP (publicado pela organizacao, ex.: copia do IFMG
#   Conselheiro Lafaiete, noticias-2021) mantem as inscricoes de fev-mar/2020, mas fixa prazos de setembro de 2021;
#   a Agencia Brasil (2023-05) cita o coordenador-geral da OBMEP premiando "alunos que ganharam medalha
